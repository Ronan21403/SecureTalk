version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: mongo
    ports:
      - "27017:27017"
    volumes:
      - securetalk_mongo-data:/data/db
    networks:
      - securetalk_network

volumes:
  securetalk_mongo-data:
    driver: local

networks:
  securetalk_network:
    driver: bridge
