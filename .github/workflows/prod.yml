name: CI/CD - Prod

on:
  push:
    branches: [prod]

jobs:
  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install frontend dependencies
        run: |
          cd client
          npm install

      - name: Run frontend tests
        run: |
          cd client
          npm test -- --watchAll=false

  backend-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: |
          cd server
          npm install

      - name: Run backend tests
        run: |
          cd server
          npm test -- --watchAll=false

  build-and-push:
      runs-on: ubuntu-latest
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Log in to Docker Hub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKERHUB_USERNAME }}
            password: ${{ secrets.DOCKERHUB_TOKEN }}

        - name: Build and push frontend image
          run: |
            docker build -t ronan2140/securetalk-frontend:latest ./client
            docker push ronan2140/securetalk-frontend:latest

        - name: Build and push backend image
          run: |
            docker build -t ronan2140/securetalk-backend:latest ./server
            docker push ronan2140/securetalk-backend:latest
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Set up kubectl
        uses: azure/setup-kubectl@v3

      - name: Get AKS credentials
        run: |
          az aks get-credentials --resource-group securetalk-rg_group --name securetalk-rg --overwrite-existing

      - name: Deploy to AKS
        run: |
          kubectl apply -f server/backend-deployment.yaml
          kubectl apply -f server/backend-service.yaml
          kubectl apply -f client/frontend-deployment.yaml
          kubectl apply -f client/frontend-service.yaml